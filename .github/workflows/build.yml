name: Build unsigned IPA
on: { push: { branches: [main] }, workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Newest Xcode on the runner
        run: |
          X=$(ls -d /Applications/Xcode*.app | sort -V | tail -1); sudo xcode-select -s "$X"; xcodebuild -version | head -2
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project Firm.xcodeproj -scheme Firm -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -destination 'generic/platform=iOS' build | tail -20
      - name: Package .ipa
        run: |
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/Firm.app Payload/
          zip -qr Firm.ipa Payload && ls -la Firm.ipa
      - uses: actions/upload-artifact@v4
        with: { name: Firm-ipa, path: Firm.ipa }
      - name: Publish release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "build-${{ github.run_number }}" Firm.ipa --title "The Firm build ${{ github.run_number }}" --notes "Unsigned IPA. Install with Feather." || gh release upload "build-${{ github.run_number }}" Firm.ipa --clobber

name: Build signed IPA
on: { push: { branches: [main] }, workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Newest Xcode
        run: X=$(ls -d /Applications/Xcode*.app | sort -V | tail -1); sudo xcode-select -s "$X"; xcodebuild -version | head -1
      - run: brew install xcodegen
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.3", bundler-cache: false }
      - run: gem install fastlane -N
      - name: Signed build
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_FORCE: "1"
          GITHUB_TOKEN: ${{ github.token }}
        run: fastlane build
      - uses: actions/upload-artifact@v4
        with: { name: Firm-ipa, path: out/Firm.ipa }
      - name: Publish release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "build-${{ github.run_number }}" out/Firm.ipa --title "The Firm build ${{ github.run_number }}" --notes "Signed development build." || gh release upload "build-${{ github.run_number }}" out/Firm.ipa --clobber

name: Build The Firm

# GitHub gives free macOS runners with Xcode pre-installed. That is the whole trick: the VPS is
# Linux and can never compile an iOS app, but this runner can, and it costs nothing on a public
# repo (and 10x minutes on a private one, so keep an eye on the quota).
#
# Two ways to run it, picked when you start it by hand:
#   testflight        The Firm, App Store signed, uploaded to TestFlight
#   device            The Firm, development signed, downloadable .ipa
#   sizer_testflight  Max Sizer, App Store signed, uploaded to TestFlight
#   sizer_device      Max Sizer, development signed, downloadable .ipa
#   tradster_testflight  Tradster, App Store signed, uploaded to TestFlight
#   tradster_device      Tradster, development signed, downloadable .ipa

on:
  workflow_dispatch:
    inputs:
      lane:
        description: What to build
        type: choice
        default: testflight
        options: [testflight, device, sizer_device, sizer_testflight, tradster_device, tradster_testflight]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The newest Xcode on the runner, not a pinned one. Pinning Xcode 16 failed with
      # "iOS 18.0 is not installed" — that image's Xcode 16 has no iOS 18 SDK, and the
      # deployment target is 18.0. The long-standing build workflow has always done this.
      - name: Newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version | head -1

      - name: Install the generator and fastlane
        run: |
          brew install xcodegen
          gem install fastlane --no-document

      # TestFlight refuses a build number it has seen before, so the run number becomes the
      # build. 6.2 (1), 6.2 (2), and so on — never a collision, never a manual bump.
      - name: Stamp the build number
        run: |
          /usr/bin/sed -i '' "s/CURRENT_PROJECT_VERSION: \".*\"/CURRENT_PROJECT_VERSION: \"${GITHUB_RUN_NUMBER}\"/" project.yml
          grep CURRENT_PROJECT_VERSION project.yml

      - name: Build
        env:
          ASC_KEY_ID:      ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID:   ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8:      ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID:   ${{ secrets.APPLE_TEAM_ID }}
          MATCH_PASSWORD:  ${{ secrets.MATCH_PASSWORD }}
          MATCH_FORCE:     "1"
          GITHUB_TOKEN:    ${{ github.token }}
          CERTS_TOKEN:     ${{ secrets.CERTS_TOKEN }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
        run: fastlane ${{ inputs.lane }}

      # Only the development lane produces something to download here; the TestFlight lane
      # hands the build to Apple instead.
      - name: Keep the .ipa
        if: endsWith(inputs.lane, 'device')
        uses: actions/upload-artifact@v4
        with:
          name: ipa-${{ inputs.lane }}-${{ github.run_number }}
          path: out/*.ipa
          if-no-files-found: error

      # An artifact expires and needs a signed-in browser; the phone wants a plain file. The VPS
      # mirrors releases onto getstubbie.com, so publish one — and tag it with the app, because
      # the mirror picks a release per app and must never serve Max Sizer as The Firm.
      - name: Publish release
        if: endsWith(inputs.lane, 'device')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "${{ inputs.lane }}" in
            sizer_device) TAG=sizer-${GITHUB_RUN_NUMBER}; TITLE="Max Sizer build ${GITHUB_RUN_NUMBER}" ;;
            tradster_device) TAG=tradster-${GITHUB_RUN_NUMBER}; TITLE="Tradster build ${GITHUB_RUN_NUMBER}" ;;
            *)            TAG=firm-${GITHUB_RUN_NUMBER};  TITLE="The Firm build ${GITHUB_RUN_NUMBER}" ;;
          esac
          gh release create "$TAG" out/*.ipa --title "$TITLE" --notes "Development signed. Sideload it." --repo "$GITHUB_REPOSITORY"

      - name: Logs, if it failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: |
            ~/Library/Logs/gym
            ~/Library/Logs/fastlane
          if-no-files-found: ignore

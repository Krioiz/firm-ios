name: Firm
options:
  bundleIdPrefix: com.getstubbie
  deploymentTarget: { iOS: "18.0" }
settings:
  base:
    DEVELOPMENT_TEAM: UW5CPP8BY5
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    MARKETING_VERSION: "6.2"
    CURRENT_PROJECT_VERSION: "26"
    TARGETED_DEVICE_FAMILY: "1"
# Declared explicitly, one scheme per app, because the implicit ones cost a build. Only `Firm`
# existed as a shared scheme, so `build_app(scheme: "Sizer")` did not fail — fastlane fell back
# to the single scheme it could find and archived The Firm instead, which then failed on a
# profile the Sizer lane had rightly not fetched. Naming the targets here also keeps the Sizer
# archive from dragging in Firm and the widget, which need different profiles.
schemes:
  Firm:
    build:
      targets: { Firm: all }
    archive: { config: Release }
  Sizer:
    build:
      targets: { Sizer: all }
    archive: { config: Release }

targets:
  Firm:
    type: application
    platform: iOS
    sources: [Firm]
    dependencies:
      - target: FirmWidget
        embed: true
    info:
      path: Firm/Info.plist
      properties:
        CFBundleDisplayName: The Firm
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIViewControllerBasedStatusBarAppearance: true
        NSAppTransportSecurity: { NSAllowsArbitraryLoads: false }
        NSFaceIDUsageDescription: Unlock The Firm with Face ID.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: com.getstubbie.firm
            CFBundleURLSchemes: [firm]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.getstubbie.firm
        PROVISIONING_PROFILE_SPECIFIER: "match Development com.getstubbie.firm"
        CODE_SIGN_ENTITLEMENTS: Firm/Firm.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  # Max Sizer — its own app, its own bundle id, its own place on the home screen. Native rather
  # than a web view: the arithmetic is trivial, it must work with no signal, and a WKWebView
  # shell would need the dashboard passkey and would likely be rejected on review besides.
  Sizer:
    type: application
    platform: iOS
    sources: [Sizer]
    info:
      path: Sizer/Info.plist
      properties:
        CFBundleDisplayName: Max Sizer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.getstubbie.sizer
        PROVISIONING_PROFILE_SPECIFIER: "match Development com.getstubbie.sizer"
        CODE_SIGN_ENTITLEMENTS: Sizer/Sizer.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  FirmWidget:
    type: app-extension
    platform: iOS
    sources:
      - FirmWidget
      - path: Firm/Shared.swift
    info:
      path: FirmWidget/Info.plist
      properties:
        CFBundleDisplayName: The Firm
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.getstubbie.firm.widget
        PROVISIONING_PROFILE_SPECIFIER: "match Development com.getstubbie.firm.widget"
        CODE_SIGN_ENTITLEMENTS: FirmWidget/FirmWidget.entitlements
        SKIP_INSTALL: true

name: Firm
options:
  bundleIdPrefix: com.getstubbie
  deploymentTarget: { iOS: "18.0" }
targets:
  Firm:
    type: application
    platform: iOS
    sources: [Firm]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Firm/Info.plist
      properties:
        CFBundleDisplayName: The Firm
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIViewControllerBasedStatusBarAppearance: true
        NSAppTransportSecurity: { NSAllowsArbitraryLoads: false }
        NSFaceIDUsageDescription: Unlock The Firm with Face ID.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.getstubbie.firm
        MARKETING_VERSION: "4.2"
        CURRENT_PROJECT_VERSION: "11"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: UW5CPP8BY5
        CODE_SIGN_IDENTITY: "Apple Development"
        PROVISIONING_PROFILE_SPECIFIER: "match Development com.getstubbie.firm"
        CODE_SIGN_ENTITLEMENTS: Firm/Firm.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
